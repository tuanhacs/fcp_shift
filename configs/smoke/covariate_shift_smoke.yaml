experiment: {kind: covariate_shift, repetitions: 2, seeds: [7]}
datasets:
  - {name: synthetic_smoke, source: synthetic_regression, task: regression, n_samples: 1200, n_features: 5, train_fraction: 0.4, seed: 11}
model: {seed: 3, learning_rate: 0.1, max_iter: 20, max_leaf_nodes: 7, early_stopping: false}
weights:
  - {name: exponential, strength: 0.2, clip_quantile: 0.95}
sample_sizes: {n_calibration: 100, m_test: 80}
fcp:
  delta: 0.1
  w_infinity: 1.0
  optimize_delta: false
  eta: 1.0e-10
  alpha_grid: {start: 0.0, stop: 1.0, points: 11}
  beta_grid: {start: 0.0, stop: 1.0, points: 11}
output: {root: outputs/smoke}

