experiment: {kind: ablation_models, repetitions: 2, seeds: [7]}
datasets:
  - {name: synth_models, source: synthetic_regression, task: regression, n_samples: 1000, n_features: 6, train_fraction: 0.4, seed: 13}
models:
  - {name: hist_gradient_boosting, seed: 3, max_iter: 15, max_leaf_nodes: 7, early_stopping: false}
  - {name: random_forest, seed: 3, n_estimators: 10, n_jobs: 1}
  - {name: linear, seed: 3, alpha: 1.0}
weights:
  - {name: exponential, strength: 0.2, clip_quantile: 0.95}
  - {name: quadratic, strength: 0.5, clip_quantile: 0.95}
sample_sizes: {n_calibration: 80, m_test: 50}
fcp:
  delta: 0.1
  w_infinity: 1.0
  optimize_delta: false
  eta: 1.0e-10
  alpha_grid: {start: 0.0, stop: 1.0, points: 11}
  beta_grid: {start: 0.0, stop: 1.0, points: 11}
output: {root: outputs/smoke}

