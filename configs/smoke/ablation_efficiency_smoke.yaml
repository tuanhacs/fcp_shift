experiment: {kind: ablation_efficiency, repetitions: 3, seeds: [7]}
datasets:
  - {name: synth_efficiency_regression, source: synthetic_regression, task: regression, n_samples: 1200, n_features: 6, train_fraction: 0.4, seed: 13}
  - {name: synth_efficiency_classification, source: synthetic_classification, task: classification, n_samples: 1200, n_features: 6, n_informative: 4, n_redundant: 1, n_classes: 3, train_fraction: 0.4, seed: 14}
model: {name: hist_gradient_boosting, seed: 3, max_iter: 20, max_leaf_nodes: 7, early_stopping: false, classification_score: log_margin}
weights:
  - {name: exponential, strength: 0.2, clip_quantile: 0.95}
  - {name: quadratic, strength: 0.5, clip_quantile: 0.95}
  - {name: mahalanobis, strength: 0.5, clip_quantile: 0.95}
sample_sizes: {n_calibration: 80, m_test: 50}
fcp:
  delta: 0.1
  w_infinity: 1.0
  optimize_delta: false
  eta: 1.0e-10
  beta_grid: {start: 0.0, stop: 1.0, points: 21}
output: {root: outputs/smoke}
