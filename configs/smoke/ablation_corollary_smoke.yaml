experiment: {kind: ablation_corollary, repetitions: 2, seeds: [7]}
datasets:
  - {name: synth_a, source: synthetic_regression, task: regression, n_samples: 800, n_features: 5, train_fraction: 0.4, seed: 11}
  - {name: synth_b, source: synthetic_regression, task: regression, n_samples: 900, n_features: 6, train_fraction: 0.4, seed: 12}
model: {name: hist_gradient_boosting, seed: 3, max_iter: 15, max_leaf_nodes: 7, early_stopping: false}
weights:
  - {name: exponential, strength: 0.2, clip_quantile: 0.95}
  - {name: quadratic, strength: 0.5, clip_quantile: 0.95}
  - {name: mahalanobis, strength: 0.5, clip_quantile: 0.95}
ablation: {alphas: [0.05, 0.1, 0.2], n_grid: [30, 60]}
fcp: {delta: 0.1, w_infinity: 1.0}
output: {root: outputs/smoke}

