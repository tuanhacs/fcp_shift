experiment: {kind: ablation_weights, repetitions: 100, seeds: [31415]}
datasets:
  - {name: year, source: openml, openml_id: 44027, task: regression, train_fraction: 0.4}
  - {name: adult, source: openml, openml_id: 1590, task: classification, train_fraction: 0.4}
model: {name: hist_gradient_boosting, seed: 2026, learning_rate: 0.08, max_iter: 300, max_leaf_nodes: 31, early_stopping: false, classification_score: log_margin}
weights:
  - {name: exponential, strength: 0.35, clip_quantile: 0.995, ridge: 0.001}
ablation: {gammas: [0.0, 0.1, 0.25, 0.5, 0.75, 1.0]}
sample_sizes: {n_calibration: 10000, m_test: 500}
fcp:
  delta: 0.1
  w_infinity: 1.0
  optimize_delta: true
  eta: 1.0e-10
  alpha_grid: {start: 0.0, stop: 1.0, points: 201}
  beta_grid: {start: 0.0, stop: 1.0, points: 201}
output: {root: outputs}

