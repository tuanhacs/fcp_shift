experiment: { kind: ablation_timing, repetitions: 20, seeds: [31415] }
datasets:
  - {
      name: adult,
      source: openml,
      openml_id: 1590,
      task: classification,
      train_fraction: 0.4,
    }
  # - {name: electricity, source: openml, openml_id: 151, task: classification, train_fraction: 0.4}
  # - {name: fashion_mnist, source: openml, openml_id: 40996, task: classification, train_fraction: 0.4}
models:
  - {
      name: hist_gradient_boosting,
      seed: 2026,
      learning_rate: 0.08,
      max_iter: 300,
      max_leaf_nodes: 31,
      early_stopping: false,
      classification_score: log_margin,
    }
  - {
      name: random_forest,
      seed: 2026,
      n_estimators: 300,
      min_samples_leaf: 2,
      n_jobs: -1,
      classification_score: log_margin,
    }
  - {
      name: logistic,
      seed: 2026,
      C: 1.0,
      max_iter: 500,
      n_jobs: -1,
      classification_score: log_margin,
    }
weights:
  - { name: exponential, strength: 0.35, clip_quantile: 0.995, ridge: 0.001 }
sample_sizes: { m_test: 500 }
ablation: { n_grid: [250, 500, 1000, 2000, 5000, 10000, 20000, 50000] }
fcp:
  delta: 0.1
  w_infinity: 1.0
  alpha_grid: { start: 0.0, stop: 1.0, points: 201 }
  beta_grid: { start: 0.0, stop: 1.0, points: 201 }
output: { root: outputs }
