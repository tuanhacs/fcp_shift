experiment:
  kind: asymptotic
  repetitions: 50
  seeds: [20260711]

simulation:
  dimension: 4
  coefficients: [2.0, 1.0, 0.0, 0.0]
  n_train: 50000
  source_pool_size: 1000000
  heteroscedastic_scale: 0.75
  minimum_noise: 0.25

model:
  seed: 2026
  learning_rate: 0.08
  max_iter: 300
  max_leaf_nodes: 31
  early_stopping: false

weights:
  - {name: exponential, strength: 0.2, clip_quantile: 0.95, ridge: 0.001}

asymptotic:
  alpha: 0.1
  beta: 0.5
  fixed_n: 20000
  fixed_m: 20000
  grid: [500, 1000, 2000, 5000, 10000, 20000, 50000, 100000]

fcp:
  delta: 0.1
  w_infinity: 1.0
  optimize_delta: true
  eta: 1.0e-10

output:
  root: outputs

